<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Result | EAES</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f1f5fb;
    color:#26364a;
}

/* HEADER */

header{
    height:78px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8%;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:155px;
    height:auto;
}

.logo-text{
    color:#277a9c;
    font-size:18px;
    font-weight:bold;
}

/* NAVIGATION */

nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#303a48;
    font-size:14px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:7px;
}

nav a:hover{
    color:#087eb5;
}

.home{
    background:#17243a;
    color:white !important;
    padding:12px 18px;
    border-radius:7px;
}

/* MAIN */

main{
    min-height:calc(100vh - 78px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* RESULT CARD */

.result-card{
    width:370px;
    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    text-align:center;
}

.result-card h1{
    color:#126184;
    font-size:30px;
    margin-bottom:8px;
}

.result-card p{
    color:#77808c;
    font-size:15px;
}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <!-- Logo will be added in the next step -->

        <div class="logo-text">
            Educational Assessment and<br>
            Examinations Services
        </div>

    </div>


    <nav>

        <a href="#" class="home">
            🏠 Home
        </a>

        <a href="#">
            ☎️ SMS
        </a>

        <a href="#">
            💬 Telegram
        </a>

        <a href="#">
            📄 Complaint
        </a>

    </nav>

</header>



<!-- MAIN CONTENT -->

<main>

    <div class="result-card">

        <h1>Student Result</h1>

        <p>
            Enter credentials to view your exam results.
        </p>

    </div>

</main>


</body>

</html>
