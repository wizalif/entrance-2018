<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Result | EAES</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f1f5fb;
    color:#26364a;
}

/* HEADER */

header{
    height:78px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 8%;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:155px;
    height:auto;
}

.logo-text{
    color:#277a9c;
    font-size:18px;
    font-weight:bold;
}

/* NAVIGATION */

nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    text-decoration:none;
    color:#303a48;
    font-size:14px;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:7px;
}

nav a:hover{
    color:#087eb5;
}

.home{
    background:#17243a;
    color:white !important;
    padding:12px 18px;
    border-radius:7px;
}

/* MAIN */

main{
    min-height:calc(100vh - 78px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* RESULT CARD */

.result-card{
    width:370px;
    background:white;
    border-radius:22px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    text-align:center;
}

.result-card h1{
    color:#126184;
    font-size:30px;
    margin-bottom:8px;
}

.result-card p{
    color:#77808c;
    font-size:15px;
}
    .input-box{
    width:100%;
    height:48px;
    background:#f1f3f6;
    border-radius:8px;
    margin-top:20px;

    display:flex;
    align-items:center;

    padding:0 14px;

    transition:.3s;
}

.input-box span{
    font-size:18px;
    margin-right:10px;
    opacity:.55;
}

.input-box input{
    width:100%;
    height:100%;

    border:none;
    outline:none;

    background:transparent;

    font-size:15px;
    color:#344054;
}

.input-box:focus-within{
    background:#e9f4fa;
    box-shadow:0 0 0 2px #1594c5;
}

.input-box input::placeholder{
    color:#9299a3;
}


#checkResult{
    width:100%;
    height:50px;

    margin-top:25px;

    border:none;
    border-radius:8px;

    background:linear-gradient(
        90deg,
        #0796ca,
        #17243a
    );

    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}
    /* VERIFICATION BOX */

.verification{
    width:100%;
    height:62px;

    margin-top:20px;

    background:#303030;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    color:white;

    border-radius:2px;

    font-size:13px;
}

.verify-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.verify-icon{
    width:30px;
    height:30px;

    border-radius:50%;

    background:#32c56b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.cloudflare{
    text-align:right;
    font-size:10px;
    color:#ddd;
}

.cloudflare strong{
    display:block;
    font-size:12px;
    letter-spacing:1px;
}

.cloudflare small{
    font-size:8px;
}

#checkResult:hover{
    transform:translateY(-2px);

    box-shadow:
        0 7px 15px rgba(0,0,0,.2);
}

</style>

</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <!-- Logo will be added in the next step -->

        <div class="logo-text">
            Educational Assessment and<br>
            Examinations Services
        </div>

    </div>


    <nav>

        <a href="#" class="home">
            🏠 Home
        </a>

        <a href="#">
            ☎️ SMS
        </a>

        <a href="#">
            💬 Telegram
        </a>

        <a href="#">
            📄 Complaint
        </a>

    </nav>

</header>



<!-- MAIN CONTENT -->

<main>

<div class="result-card">

    <h1>Student Result</h1>

    <p>
        Enter credentials to view your exam results.
    </p>


    <!-- ADMISSION NUMBER -->

    <div class="input-box">

        <span>🔑</span>

        <input
            type="text"
            id="admission"
            placeholder="Admission Number"
        >

    </div>


    <!-- FIRST NAME -->

    <div class="input-box">

        <span>👤</span>

        <input
            type="text"
            id="firstname"
            placeholder="First Name"
        >

    </div>
    <div class="verification">

    <div class="verify-left">

        <div class="verify-icon">
            ✓
        </div>

        <span>Success!</span>

    </div>


    <div class="cloudflare">

        <strong>CLOUDFLARE</strong>

        <small>
            Privacy • Help
        </small>

    </div>

</div>


    <!-- CHECK RESULT BUTTON -->

    <button id="checkResult">
        Check Result
    </button>

</div>

</main>


    <script>

const checkButton = document.getElementById("checkResult");

checkButton.addEventListener("click", function(){

    const admission =
        document.getElementById("admission").value.trim();

    const firstname =
        document.getElementById("firstname").value.trim();


    if(admission === "" || firstname === ""){

        alert("Please enter your Admission Number and First Name.");

        return;

    }


    // Open the result page

    window.location.href = "result.html";

});

</script>
</body>

</html>
