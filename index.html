<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Result</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 25px 5px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            border: 2px solid #287c9f;
            border-radius: 15px;
            overflow: hidden;
        }

        .header {
            background: #287c9f;
            color: white;
            padding: 55px 60px;
        }

        .header h1 {
            font-size: 38px;
            font-weight: 500;
        }

        .form {
            padding: 65px 60px 55px;
        }

        label {
            display: block;
            font-size: 25px;
            color: #222;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            height: 80px;
            border: 2px solid #d6dce0;
            border-radius: 14px;
            padding: 0 45px;
            font-size: 27px;
            outline: none;
            color: #287c9f;
        }

        input:focus {
            border-color: #287c9f;
        }

        .forgot {
            display: block;
            margin-top: 18px;
            margin-bottom: 85px;
            color: #4d91ff;
            font-size: 23px;
            text-decoration: none;
        }

        button {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 26px;
            cursor: pointer;
            margin-top: 42px;
        }

        .check {
            background: #287c9f;
        }

        .response {
            background: #079b70;
        }

        @media (max-width: 600px) {

            .header {
                padding: 40px 30px;
            }

            .header h1 {
                font-size: 30px;
            }

            .form {
                padding: 45px 30px;
            }

            label {
                font-size: 21px;
            }

            input {
                height: 65px;
                font-size: 21px;
                padding: 0 25px;
            }

            .forgot {
                font-size: 19px;
                margin-bottom: 55px;
            }

            button {
                height: 65px;
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Check Result</h1>
        </div>

        <div class="form">

            <label>Registration Number</label>

            <input
                type="text"
                placeholder="XXXXXX"
            >

            <a href="#" class="forgot">
                Forgot admission number?
            </a>

            <label>First Name</label>

            <input
                type="text"
                placeholder="WRITE HERE..."
            >

<button class="check" onclick="checkResult()">
    ⌾ &nbsp; Check Result
</button>

            <button class="response">
                ▣ &nbsp; Compliant Response
            </button>

        </div>

    </div>

    <script>
function checkResult() {
    const registration = document.querySelectorAll("input")[0].value;
    const firstName = document.querySelectorAll("input")[1].value;

    if (registration === "" || firstName === "") {
        alert("Please enter your Registration Number and First Name.");
        return;
    }

    alert("Result found for " + firstName + "!");
}
</script>
</body>
</html>
